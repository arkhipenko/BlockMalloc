sentence=malloc() wrapper that rounds every request up to a multiple of a block size.
paragraph=Freed heap chunks then come in fewer distinct sizes, which can help a heap that repeatedly frees and allocates buffers of similar size. Overflow-safe rounding, a pointer-clearing free for typed pointers, and a shared global instance that is usable during static initialization. Memory stays compatible with free().
